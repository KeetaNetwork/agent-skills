name: Deploy catalog to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/**"
      - ".github/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 .github/scripts/validate-skills.py
      - name: Build site with hosted skills
        run: python3 .github/scripts/build-site.py _site
      # Pages must already be enabled with "GitHub Actions" as the source (Settings → Pages).
      # The workflow token cannot create the Pages site on its own.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Keep v3: v4 drops dot-directories such as .well-known/ with no opt-out,
      # and v5 drops them unless include-hidden-files is true.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

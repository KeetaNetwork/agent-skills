name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Compute pages match their Markdown
        run: |
          python3 .github/scripts/render-compute-pages.py site/compute
          git diff --exit-code site/compute
      - name: Build the keeta.ai site
        run: python3 .github/scripts/build-site.py _site
      - name: Check hosted entry points
        run: |
          test -s _site/index.html && test -s _site/404.html && test -s _site/styles.css && test -s _site/app.js
          test -s _site/assets/og-image.png && test -s _site/assets/fonts/Geist-Regular.woff2
          test -s _site/llms.txt && test -s _site/_headers && test -s _site/_redirects
          test -s _site/compute/compute.css
          for page in index app models router helper protocol; do
            test -s "_site/compute/$page.html" && test -s "_site/compute/$page.md" || { echo "missing compute page $page"; exit 1; }
          done
          grep -q 'llama-3.2-3b-instruct' _site/compute/models.md && grep -q 'llama-3.2-3b-instruct' _site/compute/models.html
          if grep -q 'keeta-compute:models-table' _site/compute/models.md _site/compute/models.html; then echo "models table not generated"; exit 1; fi
          grep -q 'https://keeta.ai/compute/router.md' _site/llms.txt && grep -q 'https://keeta.md/llms.txt' _site/llms.txt
      - name: Check the Pages output directory matches the build
        run: grep -qx 'pages_build_output_dir = "./_site"' wrangler.toml
      - name: Check the skills live only at keeta.md
        run: |
          # The skills moved to KeetaNetwork/keeta.md; old keeta.ai skill URLs redirect there.
          if git ls-files | grep -qi 'skill\.md$'; then echo "SKILL.md files belong in KeetaNetwork/keeta.md"; exit 1; fi
          for path in /SKILL.md /skills/ /llms-full.txt /.well-known/agent-skills/ /.well-known/skills/; do
            grep -q "^$path.* https://keeta.md/.* 301$" site/_redirects || { echo "no redirect for $path"; exit 1; }
          done

  compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: compute/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: End-to-end test
        run: npm run test:e2e
      - name: Relay Worker under wrangler dev
        run: npm run test:worker

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: compute/macos
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (KeetaComputeKit)
        run: swift test
      - name: Build the app (unsigned)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project KeetaCompute.xcodeproj -scheme KeetaCompute -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Draw the menu bar popover with sample data
        timeout-minutes: 5
        run: |
          APP="build/DerivedData/Build/Products/Debug/Keeta Compute.app"
          # An ad-hoc signature is enough to run the unsigned Debug build here.
          codesign --force --deep --sign - "$APP"
          "$APP/Contents/MacOS/Keeta Compute" --snapshot "$PWD/build/screenshots"
          ls -la build/screenshots
      - name: Upload the popover screenshots
        uses: actions/upload-artifact@v4
        with:
          name: macos-popover-screenshots
          path: compute/macos/build/screenshots
          if-no-files-found: error

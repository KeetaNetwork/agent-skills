name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and metadata
        run: python3 .github/scripts/validate-skills.py
      - name: Check the Compute pages match their Markdown
        run: |
          python3 .github/scripts/render-compute-pages.py site/compute
          git diff --exit-code site/compute
      - name: Build the keeta.ai site
        run: python3 .github/scripts/build-site.py _site
      - name: Check hosted entry points
        run: |
          test -s _site/index.html && test -s _site/404.html && test -s _site/styles.css && test -s _site/app.js
          test -s _site/assets/og-image.png && test -s _site/assets/fonts/Geist-Regular.woff2
          test -s _site/SKILL.md && test -s _site/skill.md && test -s _site/llms.txt && test -s _site/llms-full.txt
          test -s _site/skills/keeta/SKILL.md && test -s _site/skills/keeta/references/anchors.md
          test -s _site/.well-known/agent-skills/index.json
          test -s _site/.well-known/skills/index.json
          test -s _site/compute/compute.css
          for page in index app models router helper protocol; do
            test -s "_site/compute/$page.html" && test -s "_site/compute/$page.md" || { echo "missing compute page $page"; exit 1; }
          done
          grep -q 'llama-3.2-3b-instruct' _site/compute/models.md && grep -q 'llama-3.2-3b-instruct' _site/compute/models.html
          if grep -q 'keeta-compute:models-table' _site/compute/models.md _site/compute/models.html; then echo "models table not generated"; exit 1; fi
          grep -q 'https://keeta.ai/compute/router.md' _site/llms.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the Pages output directory matches the build
        run: grep -qx 'pages_build_output_dir = "./_site"' wrangler.toml
      - name: Install every skill from the built site with the skills CLI
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site &
          sleep 1
          npx --yes skills@1.7.0 add http://127.0.0.1:8000 --list | tee skills-list.txt
          for skill in $(python3 -c "import json; print(' '.join(s['name'] for s in json.load(open('_site/.well-known/agent-skills/index.json'))['skills']))"); do
            grep -q "$skill" skills-list.txt || { echo "skills CLI did not list $skill"; exit 1; }
          done

  compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: compute/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: End-to-end test
        run: npm run test:e2e

name: Deploy keeta.ai to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-keeta-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 .github/scripts/validate-skills.py
      - name: Build site with hosted skills
        run: python3 .github/scripts/build-site.py _site
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README: Hosting on keeta.ai)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # wrangler.jsonc serves _site/ as an assets-only Worker and attaches keeta.ai to it.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.147.0 deploy
